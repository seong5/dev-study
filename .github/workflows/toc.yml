name: README 목차 갱신

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toc
  cancel-in-progress: false

jobs:
  toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 목차 생성
        run: node scripts/generate-toc.mjs

      - name: 변경이 있으면 커밋
        run: |
          if git diff --quiet README.md; then
            echo "목차 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "📝 docs: README 목차 자동 갱신"
          git push
